<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">TaskHandoff terminal demo</title>
  <desc id="desc">Animated terminal showing handoff go launching a Claude session</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12151a"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <clipPath id="termClip">
      <rect x="48" y="64" width="864" height="420" rx="14"/>
    </clipPath>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <text fill="#f4f7fb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" x="48" y="36">30 seconds from stuck ? continued</text>
  <text fill="#9aa3b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" x="48" y="56">TaskHandoff · cross-agent continuity</text>

  <rect x="48" y="64" width="864" height="420" rx="14" fill="#161a21" stroke="#2a3140"/>
  <circle cx="78" cy="92" r="6" fill="#ff5f57"/>
  <circle cx="100" cy="92" r="6" fill="#febc2e"/>
  <circle cx="122" cy="92" r="6" fill="#28c840"/>
  <text fill="#8b93a0" font-family="ui-monospace, Menlo, monospace" font-size="16" x="150" y="97">~/project</text>

  <g clip-path="url(#termClip)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.08;0.92;1" dur="12s" repeatCount="indefinite"/>
      <text font-family="ui-monospace, Menlo, monospace" font-size="17" x="72" y="150">
        <tspan fill="#7ddea5">?</tspan>
        <tspan fill="#e8edf5"> handoff go --goal "Finish webhook idempotency" --name webhook</tspan>
      </text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.17;0.92;1" dur="12s" repeatCount="indefinite"/>
      <text fill="#c5ccd8" font-family="ui-monospace, Menlo, monospace" font-size="16" x="72" y="190">Initialized .handoff/</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.27;0.92;1" dur="12s" repeatCount="indefinite"/>
      <text fill="#c5ccd8" font-family="ui-monospace, Menlo, monospace" font-size="16" x="72" y="222">Saved webhook-idempotency r1</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.37;0.92;1" dur="12s" repeatCount="indefinite"/>
      <text fill="#7ddea5" font-family="ui-monospace, Menlo, monospace" font-size="16" x="72" y="254">Freshness: FRESH</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.47;0.92;1" dur="12s" repeatCount="indefinite"/>
      <text fill="#c5ccd8" font-family="ui-monospace, Menlo, monospace" font-size="16" x="72" y="286">Target: claude · Session: webhook</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.57;0.92;1" dur="12s" repeatCount="indefinite"/>
      <text fill="#c5ccd8" font-family="ui-monospace, Menlo, monospace" font-size="16" x="72" y="318">Clipboard: backup ready.</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.67;0.92;1" dur="12s" repeatCount="indefinite"/>
      <text fill="#7ddea5" font-family="ui-monospace, Menlo, monospace" font-size="16" x="72" y="350">Target agent launched (terminal).</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.77;0.92;1" dur="12s" repeatCount="indefinite"/>
      <text fill="#c5ccd8" font-family="ui-monospace, Menlo, monospace" font-size="16" x="72" y="382">Re-enter: handoff enter webhook-idempotency --to claude</text>
      <rect x="72" y="404" width="10" height="18" rx="2" fill="#7ddea5">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <text fill="#9aa3b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" x="48" y="520">No transcript dump. No context amnesia. Just a verifiable baton pass.</text>
</svg>
